[package]
name = "gateway"
version = "0.1.0"
edition = "2024"
description = "The Please Behave gateway"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.6", features = ["limit", "request-id", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json"] }
