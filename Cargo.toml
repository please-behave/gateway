[package]
name = "gateway"
version = "0.1.0"
edition = "2024"
description = "The Please Behave gateway"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
jsonschema = { version = "0.62.0", default-features = false }
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
rand = { version = "0.9.2", default-features = false, features = ["os_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.0", features = ["limit", "request-id", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json"] }
