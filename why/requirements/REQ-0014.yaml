id: REQ-0014
name: Accept, forward and report release facts
area: releases
description: >-
  The gateway must validate a public release fact against the ingest contract,
  including a full Git object ID, and forward it once with the authenticated
  sender and authentication method. It must relay the ledger's validated
  creation, unchanged or conflict outcome and report delivery failures using
  the existing ingest error mapping. It must neither persist nor retry the
  submission.
rationale: >-
  Release workflows need an attributable record of the commit for a version
  and a way to distinguish a confirmed record from a delivery failure.
decisions:
  - DEC-0002
  - why:DEC-0020
