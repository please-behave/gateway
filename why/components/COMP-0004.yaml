id: COMP-0004
name: Registration Validation
purpose: >-
  Validates registration batches and the ledger's outcomes for them.
scope:
  - >-
    Validates rule, Rule Set and deployment target registration batches against
    their ingest contract schemas, including bounds, unique JSON keys and the
    absence of client-supplied attribution.
  - >-
    Validates every entry of a batch before any of it is forwarded.
  - >-
    Requires the knowledge fields of a rule and preserves valid unfamiliar ones.
  - >-
    Validates the ledger's per-entry outcomes and returns them in request order.
out_of_scope:
  - description: Authenticating and rate-limiting the sender.
    owner: COMP-0002
  - description: Sending a batch to the ledger.
    owner: COMP-0005
must_not:
  - >-
    Accept a batch of which any entry is invalid.
  - >-
    Persist a submitted batch.
files:
  - src/registration.rs
  - why/contracts/ingest/rule-registration.schema.json
  - why/contracts/ingest/rule-set-registration.schema.json
  - why/contracts/ingest/target-registration.schema.json
depends_on:
  - COMP-0005
requirements:
  - REQ-0011
  - REQ-0012
  - REQ-0015
  - REQ-0016
